<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.left {
  background: #f7f7f3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 72px 64px 56px;
}
.title {
  font-size: 82px;
  font-weight: 700;
  color: #111827;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.subtitle {
  font-size: 26px;
  font-weight: 500;
  color: #6b7280;
  margin-top: 20px;
  line-height: 1.5;
}
.url {
  font-size: 18px;
  font-weight: 600;
  color: #9ca3af;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.right {
  background: #111827;
  position: relative;
  overflow: hidden;
}
.circle {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.12);
}
.circle-1 {
  width: 420px;
  height: 420px;
  top: -40px;
  right: -80px;
}
.circle-2 {
  width: 300px;
  height: 300px;
  top: 20px;
  right: -20px;
}
.circle-3 {
  width: 160px;
  height: 160px;
  top: 50px;
  right: 30px;
  background: rgba(255,255,255,0.06);
  border: none;
}
.dots {
  position: absolute;
  bottom: 80px;
  right: 120px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
}
/* waveform decoration */
.wave {
  position: absolute;
  bottom: 180px;
  left: 50px;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 120px;
}
.bar {
  width: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.10);
}
</style>
</head>
<body>
<div class="left">
  <div>
    <div class="title">YouTube<br>音源診断</div>
    <div class="subtitle">True Peak・形式・LUFSを<br>ブラウザ内で診断</div>
  </div>
  <div class="url">yt-audio.niisan.org</div>
</div>
<div class="right">
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>
  <div class="wave" id="wave"></div>
  <div class="dots" id="dots"></div>
</div>
<script>
// generate dot grid
const dotsEl = document.getElementById('dots');
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
}
// generate waveform bars
const waveEl = document.getElementById('wave');
const heights = [20,35,55,70,90,65,80,100,75,50,85,95,60,40,70,55,80,45,30,65,90,50,35,75,60];
heights.forEach(h => {
  const b = document.createElement('div');
  b.className = 'bar';
  b.style.height = h + 'px';
  waveEl.appendChild(b);
});
</script>
</body>
</html>
