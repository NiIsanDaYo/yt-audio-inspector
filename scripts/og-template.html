<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
  background: #faf9f6;
  color: #1d1c1a;
  display: flex;
  flex-direction: column;
  padding: 88px 96px 72px;
}
.title {
  font-size: 74px;
  font-weight: 650;
  line-height: 1.15;
  letter-spacing: 0.01em;
}
.subtitle {
  font-size: 27px;
  color: #78726a;
  margin-top: 22px;
  line-height: 1.6;
}
.rows {
  width: 100%;
  margin-top: 64px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 28px 0;
  border-top: 1.5px solid #e8e4dc;
}
.row:last-child {
  border-bottom: 1.5px solid #e8e4dc;
}
.row .label {
  font-size: 21px;
  color: #78726a;
  margin-bottom: 8px;
}
.row .value {
  font-size: 34px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 23px;
  font-weight: 600;
  margin-bottom: 5px;
}
.status .dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.status-ok { color: #2e6b48; }
.status-ok .dot { background: #2e6b48; }
.footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: auto;
}
.url {
  font-size: 20px;
  font-weight: 600;
  color: #a39d94;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.note {
  font-size: 20px;
  color: #a39d94;
}
</style>
</head>
<body>
<div>
  <div class="title">YouTube音源診断</div>
  <div class="subtitle">True Peak・形式・LUFSをブラウザ内で診断</div>
</div>
<div class="rows">
  <div class="row">
    <div>
      <div class="label">True Peak</div>
      <div class="value">-1.0 dBTP</div>
    </div>
    <div class="status status-ok"><span class="dot"></span>正常</div>
  </div>
  <div class="row">
    <div>
      <div class="label">サンプルレート</div>
      <div class="value">48 kHz</div>
    </div>
    <div class="status status-ok"><span class="dot"></span>正常</div>
  </div>
</div>
<div class="footer">
  <div class="url">yt-audio.niisan.org</div>
  <div class="note">ファイルはアップロードされません</div>
</div>
</body>
</html>
